<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clasificación de peso</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <main class="container">
      <section class="card">
        <div class="header-imc">
          <img src="imagenes.img/IMC.jpg" alt="Gráfico de IMC" class="imc-image" />
          <h1>Clasificación de peso</h1>
        </div>
        <p class="subtitle">Calcula tu índice de masa corporal (IMC)</p>

        <form id="imcForm" novalidate>
          <div class="field">
            <label for="peso">Peso (kg)</label>
            <input id="peso" type="number" min="1" step="0.1" placeholder="Ej. 45.6" required />
          </div>
          <div class="field">
            <label for="altura">Altura (cm)</label>
            <input id="altura" type="number" min="1" step="0.1" placeholder="Ej. 160" required />
          </div>

          <button type="submit">Calcular</button>
        </form>

        <div id="resultado" class="result" aria-live="polite">
          Ingresa tus datos para ver tu clasificación.
        </div>
      </section>
    </main>
    
    <script src="style.js"></script>
  </body>
</html>
